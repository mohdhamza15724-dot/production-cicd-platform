name: Production CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: production-cicd-platform
  EC2_INSTANCE_ID: i-0108259bb1fa2337c
  CONTAINER_NAME: production-cicd
  CONTAINER_PORT: 5000
  STATE_DIR: /opt/production-cicd

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::342572234760:role/ProductionCICD-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          DEPLOY_SCRIPT=$(cat <<EOF
          set -e

          STATE_DIR="$STATE_DIR"
          CURRENT_IMAGE_FILE="\$STATE_DIR/current_image"
          PREVIOUS_IMAGE_FILE="\$STATE_DIR/previous_image"

          echo "========================================"
          echo "Starting production deployment"
          echo "New image: $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "========================================"

          echo "Preparing deployment state directory..."

          mkdir -p "\$STATE_DIR"

          echo "Checking current deployment state..."

          CURRENT_IMAGE=""

          if [ -f "\$CURRENT_IMAGE_FILE" ]; then
              CURRENT_IMAGE=\$(cat "\$CURRENT_IMAGE_FILE")
          fi

          if [ -z "\$CURRENT_IMAGE" ] && docker inspect $CONTAINER_NAME >/dev/null 2>&1; then
              CURRENT_IMAGE=\$(docker inspect \
                --format='{{.Config.Image}}' \
                $CONTAINER_NAME)
          fi

          echo "Current image: \${CURRENT_IMAGE:-none}"

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region $AWS_REGION | \
            docker login \
            --username AWS \
            --password-stdin $REGISTRY

          echo "Pulling new image..."

          docker pull $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Saving rollback state..."

          if [ -n "\$CURRENT_IMAGE" ]; then
              echo "\$CURRENT_IMAGE" > "\$PREVIOUS_IMAGE_FILE"
              echo "Previous image saved: \$CURRENT_IMAGE"
          else
              echo "No previous image available."
              rm -f "\$PREVIOUS_IMAGE_FILE"
          fi

          echo "Stopping current container..."

          docker stop $CONTAINER_NAME 2>/dev/null || true

          echo "Removing current container..."

          docker rm $CONTAINER_NAME 2>/dev/null || true

          echo "Starting new container..."

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            --log-driver=awslogs \
            --log-opt awslogs-region=$AWS_REGION \
            --log-opt awslogs-group=/production-cicd/application \
            --log-opt awslogs-create-group=true \
            --log-opt awslogs-stream=production-cicd \
            -p 127.0.0.1:$CONTAINER_PORT:$CONTAINER_PORT \
            -e ENVIRONMENT=production \
            -e APP_VERSION=$IMAGE_TAG \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Waiting for application startup..."

          sleep 5

          echo "Running health check..."

          if curl -f --max-time 10 \
            http://127.0.0.1:$CONTAINER_PORT/health; then

              echo
              echo "========================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "Application is healthy."
              echo "========================================"

              echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > "\$CURRENT_IMAGE_FILE"

              echo "Current image recorded:"
              cat "\$CURRENT_IMAGE_FILE"

              exit 0

          else

              echo
              echo "========================================"
              echo "HEALTH CHECK FAILED"
              echo "Starting automatic rollback..."
              echo "========================================"

              echo "Stopping failed container..."

              docker stop $CONTAINER_NAME 2>/dev/null || true

              echo "Removing failed container..."

              docker rm $CONTAINER_NAME 2>/dev/null || true

              if [ -f "\$PREVIOUS_IMAGE_FILE" ] && [ -s "\$PREVIOUS_IMAGE_FILE" ]; then

                  PREVIOUS_IMAGE=\$(cat "\$PREVIOUS_IMAGE_FILE")

                  echo "Restoring previous image:"
                  echo "\$PREVIOUS_IMAGE"

                  docker pull "\$PREVIOUS_IMAGE"

                  PREVIOUS_TAG="\${PREVIOUS_IMAGE##*:}"

                  echo "Starting previous image..."

                  docker run -d \
                    --name $CONTAINER_NAME \
                    --restart unless-stopped \
                    --log-driver=awslogs \
                    --log-opt awslogs-region=$AWS_REGION \
                    --log-opt awslogs-group=/production-cicd/application \
                    --log-opt awslogs-create-group=true \
                    --log-opt awslogs-stream=production-cicd \
                    -p 127.0.0.1:$CONTAINER_PORT:$CONTAINER_PORT \
                    -e ENVIRONMENT=production \
                    -e APP_VERSION="\$PREVIOUS_TAG" \
                    "\$PREVIOUS_IMAGE"

                  echo "Waiting for rollback..."

                  sleep 5

                  echo "Checking rolled-back application..."

                  if curl -f --max-time 10 \
                    http://127.0.0.1:$CONTAINER_PORT/health; then

                      echo
                      echo "========================================"
                      echo "ROLLBACK SUCCESSFUL"
                      echo "Previous version restored and healthy."
                      echo "========================================"

                      echo "\$PREVIOUS_IMAGE" > "\$CURRENT_IMAGE_FILE"

                      echo "Current image restored to:"
                      cat "\$CURRENT_IMAGE_FILE"

                  else

                      echo
                      echo "========================================"
                      echo "ROLLBACK FAILED"
                      echo "Manual intervention required."
                      echo "========================================"

                      exit 1

                  fi

              else

                  echo
                  echo "========================================"
                  echo "NO PREVIOUS IMAGE AVAILABLE"
                  echo "Cannot perform automatic rollback."
                  echo "========================================"

                  exit 1

              fi

              exit 1

          fi

          EOF
          )

          PARAMS=$(jq -n --arg commands "$DEPLOY_SCRIPT" \
            '{commands: [$commands]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy production-cicd $IMAGE_TAG" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment completed successfully."

                echo "========== Deployment Output =========="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text

                echo "========== End Deployment Output =========="

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "Deployment failed."

                echo "========== Deployment Output =========="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "========== Deployment Error =========="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "Deployment timed out waiting for SSM."
          exit 1